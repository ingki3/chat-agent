name: ci

on:
  pull_request:
    branches: [dev, main, tmp/219-base3]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # #219: a pull request that changes only documentation skips the heavy test and e2e shards; the required checks
  # `test` and `e2e` still report (success), so nothing is left pending. Pushes to dev and main always run everything.
  # The diff: scripts/ci/changes.sh; what counts as documentation: scripts/ci/docs-only.sh (an allow-list). Both are
  # tested in scripts/test/docs-only.test.ts.
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fails the job (and so `test` and `e2e`) if the changed files cannot be listed; see the script.
          docs_only=$(bash scripts/ci/changes.sh)
          if [ "$docs_only" = true ]; then echo "documentation only: the test and e2e shards are skipped"; fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test-shard:
    name: test shard ${{ matrix.shard }}/4
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: pw
        run: |
          echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
      # The browser and the system packages' .deb files (the fonts: 22 MB that some runners' apt mirror serves at
      # ~150 kB/s, minutes). Keyed on the Playwright version and the runner OS — not the image build, which differs
      # between the runners of one run.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-debs
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}-shell
      # PNG/PDF export (#51): the renderer tests drive the real Chrome Headless Shell (they fail in CI without it).
      # The runner's apt mirror is sometimes unreachable; retry, then fall back to the browser alone (the ubuntu image already has Chrome's libraries).
      # With the cache restored nothing is downloaded but apt's package index.
      - name: Install Playwright browser
        run: |
          # Cached .deb files go where apt looks first: apt-get then downloads only what is newer than them.
          if ls ~/.cache/playwright-debs/*.deb >/dev/null 2>&1; then sudo cp ~/.cache/playwright-debs/*.deb /var/cache/apt/archives/; fi
          for i in 1 2 3; do
            if pnpm exec playwright install --with-deps --only-shell chromium; then
              mkdir -p ~/.cache/playwright-debs
              cp /var/cache/apt/archives/*.deb ~/.cache/playwright-debs/ 2>/dev/null || true
              exit 0
            fi
            echo "browser install with system packages failed (attempt $i); retrying" >&2
            sleep 20
          done
          echo "falling back to installing the browser without system packages" >&2
          pnpm exec playwright install --only-shell chromium
      - run: pnpm test --shard=${{ matrix.shard }}/4

  # The required check `test`: passes only when every shard passed (or all were skipped for a documentation-only PR).
  test:
    needs: [changes, test-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          SHARDS: ${{ needs.test-shard.result }}
        run: |
          echo "changes=$CHANGES docs_only=$DOCS_ONLY shards=$SHARDS"
          if [ "$CHANGES" = "success" ] && [ "$DOCS_ONLY" = "true" ] && [ "$SHARDS" = "skipped" ]; then
            echo "documentation only: tests skipped"; exit 0
          fi
          [ "$CHANGES" = "success" ] && [ "$SHARDS" = "success" ] || { echo "a test shard did not pass" >&2; exit 1; }

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e-shard:
    name: e2e shard ${{ matrix.id }}
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: "1-of-3", args: "--project=desktop --project=mobile --shard=1/3" }
          - { id: "2-of-3", args: "--project=desktop --project=mobile --shard=2/3" }
          - { id: "3-of-3", args: "--project=desktop --project=mobile --shard=3/3" }
          # The @heavy tests on a server of their own (they never share it with the timing-sensitive specs, #150).
          - { id: "heavy", args: "--project=desktop-heavy --project=mobile-heavy", heavy_alone: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: pw
        run: |
          echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
      # The browser and the system packages' .deb files (the fonts: 22 MB that some runners' apt mirror serves at
      # ~150 kB/s, minutes). Keyed on the Playwright version and the runner OS — not the image build, which differs
      # between the runners of one run.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-debs
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}-chromium
      # The runner's apt mirror is sometimes unreachable; retry, then fall back to the browser alone (the ubuntu image already has Chrome's libraries).
      # With the cache restored nothing is downloaded but apt's package index.
      - name: Install Playwright browser
        run: |
          # Cached .deb files go where apt looks first: apt-get then downloads only what is newer than them.
          if ls ~/.cache/playwright-debs/*.deb >/dev/null 2>&1; then sudo cp ~/.cache/playwright-debs/*.deb /var/cache/apt/archives/; fi
          for i in 1 2 3; do
            if pnpm exec playwright install --with-deps chromium; then
              mkdir -p ~/.cache/playwright-debs
              cp /var/cache/apt/archives/*.deb ~/.cache/playwright-debs/ 2>/dev/null || true
              exit 0
            fi
            echo "browser install with system packages failed (attempt $i); retrying" >&2
            sleep 20
          done
          echo "falling back to installing the browser without system packages" >&2
          pnpm exec playwright install chromium
      - run: pnpm build
      - run: pnpm e2e ${{ matrix.args }}
        env:
          E2E_HEAVY_ALONE: ${{ matrix.heavy_alone || '0' }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.id }}
          path: playwright-report/
          retention-days: 7

  # The required check `e2e`: passes only when every shard passed (or all were skipped for a documentation-only PR).
  e2e:
    needs: [changes, e2e-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          echo "changes=$CHANGES docs_only=$DOCS_ONLY shards=$SHARDS"
          if [ "$CHANGES" = "success" ] && [ "$DOCS_ONLY" = "true" ] && [ "$SHARDS" = "skipped" ]; then
            echo "documentation only: e2e skipped"; exit 0
          fi
          [ "$CHANGES" = "success" ] && [ "$SHARDS" = "success" ] || { echo "an e2e shard did not pass" >&2; exit 1; }
